services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distribution-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - distribution-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: distribution-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - distribution-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: distribution-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: distribution_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: distribution
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - distribution-network

  redis:
    image: redis:7-alpine
    container_name: distribution-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - distribution-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distribution-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - distribution-network
    depends_on:
      - app
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distribution-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    networks:
      - distribution-network
    depends_on:
      - app
      - mysql
      - redis

networks:
  distribution-network:
    driver: bridge

volumes:
  mysql-data:
